<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3640D6" />
    <meta name="description" content="Order from your distributor in a few taps: catalogue, repeat orders, or just type your order." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Company A Orders</title>
  </head>
  <body>
    <div id="root">
      <!-- Static shell: paints as soon as the HTML arrives, before any JavaScript downloads (slow 3G). React replaces it. -->
      <div style="font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;background:#F5F6F8;color:#12162B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
        <div style="width:52px;height:52px;border-radius:14px;background:#3640D6;border:2px solid #12162B;box-shadow:3px 3px 0 #12162B"></div>
        <div style="font-weight:700;font-size:18px">Company A Orders</div>
        <noscript>This app needs JavaScript.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
